name: Deploy OpenPOS Cloudflare production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloudflare/production-proxy.js"
      - "wrangler.production.jsonc"
      - ".github/workflows/cloudflare-production-deploy.yml"
  workflow_run:
    workflows: ["Deploy OpenPOS Cloudflare staging"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: openpos-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy-production:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check required repository secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing GitHub Actions secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing GitHub Actions secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply Cloudflare Node.js compatibility patch
        run: node scripts/patch-workers-deps.cjs

      - name: Run OpenPOS test suite
        run: npm test

      - name: Deploy free production workers.dev endpoint
        run: npx --yes wrangler@4 deploy --config=wrangler.production.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production PostgreSQL catalog and API status
        run: |
          node --input-type=module <<'NODE'
          const base = "https://openpos.b4u2store.workers.dev";
          for (const path of ["/api/categories", "/api/items"]) {
            const response = await fetch(new URL(path, base), { signal: AbortSignal.timeout(40000) });
            const body = await response.text();
            if (!response.ok) throw new Error(`${path} returned HTTP ${response.status}: ${body.slice(0, 300)}`);
            const data = JSON.parse(body);
            if (!Array.isArray(data)) throw new Error(`${path} did not return a real catalog array`);
            console.log(`${path}: ${data.length} live PostgreSQL records`);
          }
          const statusResponse = await fetch(new URL("/api/status", base), { signal: AbortSignal.timeout(40000) });
          const status = await statusResponse.json();
          if (!statusResponse.ok || status.status !== "online" || status.database?.connected !== true ||
              !String(status.storageEngine || "").startsWith("PostgreSQL")) {
            throw new Error("Production PostgreSQL status failed: " + JSON.stringify(status));
          }
          console.log("Production API and PostgreSQL status verified.");
          NODE

      - name: Verify production storefront and API proxy
        run: |
          node --input-type=module <<'NODE'
          const base = "https://openpos.b4u2store.workers.dev";
          for (const path of ["/", "/order", "/kitchen"]) {
            const response = await fetch(new URL(path, base));
            if (!response.ok) throw new Error(`${path} returned HTTP ${response.status}`);
            console.log(`${path}: HTTP ${response.status}`);
          }
          const health = await fetch(new URL("/health", base));
          if (!health.ok) throw new Error(`/health returned HTTP ${health.status}`);
          const healthBody = await health.json();
          if (healthBody.status !== "ok") throw new Error("Production upstream health check failed");
          const authConfig = await fetch(new URL("/api/auth-config", base));
          const authBody = await authConfig.json();
          if (authBody.configured !== true) throw new Error("Production Supabase auth is not configured");
          const privateRoute = await fetch(new URL("/api/store", base));
          if (privateRoute.status !== 401) throw new Error(`Private API returned HTTP ${privateRoute.status}, expected 401`);
          console.log("Production proxy, Supabase configuration, and API auth boundary verified.");
          NODE
