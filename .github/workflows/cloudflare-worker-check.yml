name: Cloudflare Worker dry-run

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/cloudflare-static-assets]
    paths:
      - "cloudflare/**"
      - "scripts/**"
      - "wrangler.jsonc"
      - "wrangler.production.jsonc"
      - "cloudflare/production-proxy.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/cloudflare-worker-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply Cloudflare Node.js compatibility patch
        run: node scripts/patch-workers-deps.cjs

      - name: Run repository test suite
        run: npm test

      - name: Validate Worker bundle without deploying
        run: npx --yes wrangler@4 deploy --dry-run --outdir=/tmp/openpos-worker-dry-run --config=wrangler.jsonc

      - name: Validate production proxy bundle without deploying
        run: npx --yes wrangler@4 deploy --dry-run --outdir=/tmp/openpos-production-proxy-dry-run --config=wrangler.production.jsonc
