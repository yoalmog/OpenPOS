name: Build OpenPOS Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "OpenPOS/**"
      - ".github/workflows/openpos-android-build.yml"

permissions:
  contents: read

concurrency:
  group: openpos-android-build
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build Android debug APK
        working-directory: OpenPOS
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openpos-android-debug
          path: OpenPOS/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
