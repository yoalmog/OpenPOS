name: OpenPOS Android APK

on:
  pull_request:
    branches: [main, fix/production-online-order-kds]
    paths:
      - "OpenPOS/**"
      - ".github/workflows/openpos-android.yml"
  push:
    branches: [feat/unified-pos-register-design]
    paths:
      - "OpenPOS/**"
      - ".github/workflows/openpos-android.yml"

permissions:
  contents: read

concurrency:
  group: openpos-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore Firebase Android configuration
        env:
          FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::Missing GitHub Actions secret FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64. Add the Base64-encoded google-services.json for Firebase Android package com.openpos.app."
            exit 1
          fi
          printf '%s' "$FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > OpenPOS/app/google-services.json
          if ! grep -q '"package_name"[[:space:]]*:[[:space:]]*"com.openpos.app"' OpenPOS/app/google-services.json; then
            echo "::error::The Firebase google-services.json does not contain Android package com.openpos.app."
            rm -f OpenPOS/app/google-services.json
            exit 1
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: OpenPOS
        run: chmod +x ./gradlew && ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openpos-debug-apk
          path: OpenPOS/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
