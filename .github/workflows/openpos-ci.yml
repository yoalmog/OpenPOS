name: OpenPOS CI

on:
  pull_request:
    branches: [main, fix/production-online-order-kds]
  push:
    branches:
      - main
      - fix/production-online-order-kds
      - feat/unified-pos-register-design

permissions:
  contents: read

concurrency:
  group: openpos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend syntax and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax/build check
        run: npm run build
      - name: Lint check
        run: npm run lint
      - name: Unit and repository tests
        run: npm test

  android-apk:
    name: Android debug APK build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Configure Firebase for Android
        env:
          FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        working-directory: OpenPOS
        run: |
          if [ -z "$FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::Missing GitHub Actions secret FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64."
            exit 1
          fi
          printf '%s' "$FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          jq -e '.project_info.project_id and .client[] | select(.client_info.android_client_info.package_name == "com.openpos.app")' app/google-services.json >/dev/null
      - name: Build debug APK
        working-directory: OpenPOS
        run: chmod +x ./gradlew && ./gradlew --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openpos-debug-apk
          path: OpenPOS/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
