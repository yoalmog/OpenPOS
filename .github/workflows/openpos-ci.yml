name: OpenPOS CI

on:
  pull_request:
    branches: [main, fix/production-online-order-kds]
  push:
    branches:
      - main
      - fix/production-online-order-kds
      - feat/unified-pos-register-design

permissions:
  contents: read

concurrency:
  group: openpos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend syntax and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax/build check
        run: npm run build
      - name: Lint check
        run: npm run lint
      - name: Unit and repository tests
        run: npm test

  android-apk:
    name: Android debug APK build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Configure Firebase for Android
        env:
          FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        working-directory: OpenPOS
        run: |
          if [ -z "$FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::Missing GitHub Actions secret FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64."
            exit 1
          fi
          printf '%s' "$FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          jq -e '.project_info.project_id and any(.client[]; .client_info.android_client_info.package_name == "com.openpos.app")' app/google-services.json >/dev/null
      - name: Configure stable Android debug signing key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          ANDROID_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
        working-directory: OpenPOS
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ] || [ -z "$ANDROID_DEBUG_KEYSTORE_PASSWORD" ]; then
            echo "::error::Missing ANDROID_DEBUG_KEYSTORE_BASE64 or ANDROID_DEBUG_KEYSTORE_PASSWORD GitHub Actions secret."
            exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/openpos-debug.keystore"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_DEBUG_KEYSTORE_PASSWORD" -alias openpos-debug >/dev/null
          ACTUAL_SHA1="$(keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_DEBUG_KEYSTORE_PASSWORD" -alias openpos-debug | awk -F 'SHA1: ' '/SHA1:/{print $2; exit}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          EXPECTED_SHA1="E616F0ACFEEFB74FFCE76F839A3C13C00D5425B2"
          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "::error::The configured Android keystore SHA-1 does not match the Firebase-registered certificate."
            echo "Expected: $EXPECTED_SHA1"
            echo "Actual:   $ACTUAL_SHA1"
            exit 1
          fi
          echo "OPENPOS_DEBUG_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "OPENPOS_DEBUG_KEYSTORE_PASSWORD=$ANDROID_DEBUG_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "OPENPOS_DEBUG_KEY_ALIAS=openpos-debug" >> "$GITHUB_ENV"
      - name: Build debug APK
        working-directory: OpenPOS
        run: chmod +x ./gradlew && ./gradlew --no-daemon assembleDebug
      - name: Verify APK signing certificate
        working-directory: OpenPOS
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          ACTUAL_SHA1="$("$APKSIGNER" verify --print-certs "$APK" | awk -F ': ' '/Signer #1 certificate SHA-1 digest:/{print $2; exit}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          EXPECTED_SHA1="E616F0ACFEEFB74FFCE76F839A3C13C00D5425B2"
          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "::error::APK was not signed with the expected Firebase certificate."
            echo "Expected: $EXPECTED_SHA1"
            echo "Actual:   $ACTUAL_SHA1"
            exit 1
          fi
          echo "Verified APK SHA-1: $ACTUAL_SHA1"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openpos-debug-apk
          path: OpenPOS/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
