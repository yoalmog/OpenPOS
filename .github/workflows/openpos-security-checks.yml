name: OpenPOS security checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [security/supabase-auth-hardening]

jobs:
  backoffice-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: OpenPOS-Backoffice/package-lock.json
      - name: Install Back Office dependencies
        working-directory: OpenPOS-Backoffice
        run: npm ci
      - name: Check API and browser JavaScript syntax
        run: |
          node --check OpenPOS-Backoffice/api/index.js
          node --check api/index.js
          node --check OpenPOS-Backoffice/public/app.js

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble Android debug APK
        working-directory: OpenPOS
        run: ./gradlew :app:assembleDebug
