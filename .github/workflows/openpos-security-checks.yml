name: OpenPOS security checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, security/supabase-auth-hardening]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backoffice-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: OpenPOS-Backoffice/package-lock.json
      - name: Install Back Office dependencies
        working-directory: OpenPOS-Backoffice
        run: npm ci
      - name: Check API and browser JavaScript syntax
        run: |
          node --check OpenPOS-Backoffice/api/index.js
          node --check api/index.js
          node --check OpenPOS-Backoffice/public/app.js

  repository-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run repository unit tests
        run: npm test

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble Android debug APK
        working-directory: OpenPOS
        run: bash ./gradlew :app:assembleDebug
      - name: Verify APK and calculate checksum
        working-directory: OpenPOS
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK" | tee apk-sha256.txt
          {
            echo "### Android APK"
            echo ' `app-debug.apk` built successfully.'
            echo ''
            echo 'SHA-256:'
            echo '```'
            cat apk-sha256.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: openpos-debug-apk-${{ github.sha }}
          path: |
            OpenPOS/app/build/outputs/apk/debug/app-debug.apk
            OpenPOS/apk-sha256.txt
          if-no-files-found: error
          retention-days: 14

  production-http-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public production pages and APIs
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://openpos-liart.vercel.app"
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT

          check_http() {
            local path="$1"
            local expected="$2"
            local body="$TMP/body"
            local metrics
            metrics="$(curl --silent --show-error --location --max-time 20 -o "$body" -w '%{http_code} %{time_total}' "$BASE$path")"
            local code="${metrics%% *}"
            local elapsed="${metrics#* }"
            echo "$path -> HTTP $code in ${elapsed}s (expected $expected)"
            test "$code" = "$expected"
            cp "$body" "$3"
          }

          for path in / /order /kitchen; do
            check_http "$path" 200 "$TMP/page"
          done

          check_http /api/status 200 "$TMP/status.json"
          node -e "const x=require(process.argv[1]); if(x.status!=='online'||!x.database?.configured||!x.database?.connected||!x.storageEngine?.startsWith('PostgreSQL')) { console.error('PostgreSQL is not verified:',x); process.exit(1); } console.log('API status:',x.status,'storage:',x.storageEngine,'database:',x.database)" "$TMP/status.json"

          check_http /api/categories 200 "$TMP/categories.json"
          node -e "const x=require(process.argv[1]); if(!Array.isArray(x)) process.exit(1); console.log('Categories:',x.length)" "$TMP/categories.json"

          check_http /api/items 200 "$TMP/items.json"
          node -e "const x=require(process.argv[1]); if(!Array.isArray(x)) process.exit(1); console.log('Items:',x.length)" "$TMP/items.json"

          for path in /api/kitchen/tickets /api/online-orders; do
            check_http "$path" 401 "$TMP/protected.json"
          done
