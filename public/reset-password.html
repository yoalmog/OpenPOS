<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Reset password | OpenPOS</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, -apple-system, sans-serif; background:#0b1220; color:#edf2f7; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; }
    main { width:min(100%,430px); padding:32px; border:1px solid #29364a; border-radius:18px; background:#121d2e; box-shadow:0 24px 70px #0006; }
    h1 { margin:0 0 8px; font-size:27px; } p { color:#aebbd0; line-height:1.55; }
    label { display:block; margin:18px 0 7px; font-size:14px; color:#d5deeb; }
    input { width:100%; padding:13px 14px; border:1px solid #3b4b63; border-radius:9px; background:#0b1423; color:white; font:inherit; }
    button { width:100%; margin-top:22px; padding:13px; border:0; border-radius:9px; background:#4f8cff; color:white; font:600 15px inherit; cursor:pointer; }
    button:disabled { opacity:.55; cursor:wait; }
    #message { min-height:24px; margin-top:16px; font-size:14px; }
    #message.error { color:#ff9b9b; } #message.success { color:#8ee0b0; }
    a { color:#8db6ff; }
  </style>
</head>
<body>
  <main>
    <h1>Set a new password</h1>
    <p>Choose a new password for your OpenPOS owner account.</p>
    <form id="reset-form" hidden>
      <label for="password">New password</label>
      <input id="password" type="password" autocomplete="new-password" minlength="8" required>
      <label for="confirm-password">Confirm new password</label>
      <input id="confirm-password" type="password" autocomplete="new-password" minlength="8" required>
      <button id="submit" type="submit">Save new password</button>
    </form>
    <p id="message" role="status" aria-live="polite">Checking your recovery link…</p>
    <p><a href="/">Return to OpenPOS</a></p>
  </main>
  <script>
    (async () => {
      const form = document.getElementById('reset-form');
      const message = document.getElementById('message');
      const submit = document.getElementById('submit');
      const showMessage = (text, kind = '') => {
        message.textContent = text;
        message.className = kind;
      };

      // Supabase recovery links normally return tokens in the URL fragment.
      // Also accept query parameters for projects using a customized email template.
      const hash = new URLSearchParams(window.location.hash.slice(1));
      const query = new URLSearchParams(window.location.search);
      const params = new URLSearchParams([...query, ...hash]);
      const accessToken = params.get('access_token');
      const recoveryType = params.get('type');
      const authError = params.get('error_description') || params.get('error');
      if (authError) {
        showMessage(authError.replace(/\+/g, ' '), 'error');
        return;
      }
      if (!accessToken || recoveryType !== 'recovery') {
        showMessage('This password recovery link is missing or expired. Request a new recovery email from your account administrator.', 'error');
        return;
      }

      // Remove bearer credentials from the address bar and browser history.
      history.replaceState(null, document.title, window.location.pathname);
      let config;
      try {
        const response = await fetch('/api/auth-config', { cache: 'no-store' });
        if (!response.ok) throw new Error('Could not load OpenPOS authentication settings.');
        config = await response.json();
        if (!config.configured || !config.supabaseUrl || !config.supabaseAnonKey) {
          throw new Error('OpenPOS authentication is not configured. Contact the administrator.');
        }
      } catch (error) {
        showMessage(error.message || 'Could not initialize password recovery.', 'error');
        return;
      }

      form.hidden = false;
      showMessage('Recovery link verified. Enter your new password.');
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const password = document.getElementById('password').value;
        const confirmation = document.getElementById('confirm-password').value;
        if (password.length < 8) {
          showMessage('Use at least 8 characters for the new password.', 'error');
          return;
        }
        if (password !== confirmation) {
          showMessage('The passwords do not match.', 'error');
          return;
        }
        submit.disabled = true;
        submit.textContent = 'Saving…';
        try {
          const response = await fetch(config.supabaseUrl.replace(/\/$/, '') + '/auth/v1/user', {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
              'apikey': config.supabaseAnonKey,
              'Authorization': 'Bearer ' + accessToken
            },
            body: JSON.stringify({ password })
          });
          const result = await response.json().catch(() => ({}));
          if (!response.ok) {
            throw new Error(result.msg || result.message || result.error_description || 'The password could not be updated. Request a new recovery link.');
          }
          form.hidden = true;
          showMessage('Password updated successfully. Return to the OpenPOS Android app and sign in with your email and new password.', 'success');
        } catch (error) {
          showMessage(error.message || 'Password update failed.', 'error');
          submit.disabled = false;
          submit.textContent = 'Save new password';
        }
      });
    })();
  </script>
</body>
</html>
