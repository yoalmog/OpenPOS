
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>איפוס סיסמה | OpenPOS</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; background: #0b1220; color: #edf2f7;
      font-family: system-ui, sans-serif;
    }
    main {
      width: min(100%, 430px); padding: 32px;
      border: 1px solid #29364a; border-radius: 18px;
      background: #121d2e; box-shadow: 0 24px 70px #0006;
    }
    h1 { margin-top: 0; font-size: 26px; }
    p { color: #aebbd0; line-height: 1.6; }
    label { display: block; margin: 18px 0 7px; }
    input {
      width: 100%; padding: 13px; border: 1px solid #3b4b63;
      border-radius: 9px; background: #0b1423; color: white;
      font: inherit;
    }
    button {
      width: 100%; margin-top: 22px; padding: 14px;
      border: 0; border-radius: 9px; background: #4f8cff;
      color: white; font: inherit; font-weight: 700; cursor: pointer;
    }
    button:disabled { opacity: .55; cursor: wait; }
    #message { min-height: 24px; margin-top: 16px; }
    .error { color: #ff9b9b; }
    .success { color: #8ee0b0; }
    a { color: #8db6ff; }
  </style>
</head>
<body>
  <main>
    <h1>הגדרת סיסמה חדשה</h1>
    <p>הזן סיסמה חדשה לחשבון הבעלים שלך ב־OpenPOS.</p>

    <form id="reset-form" hidden>
      <label for="password">סיסמה חדשה</label>
      <input id="password" type="password"
        autocomplete="new-password" minlength="8" required>

      <label for="confirm-password">אימות סיסמה</label>
      <input id="confirm-password" type="password"
        autocomplete="new-password" minlength="8" required>

      <button id="submit" type="submit">שמירת סיסמה חדשה</button>
    </form>

    <p id="message" role="status" aria-live="polite">
      בודק את קישור האיפוס...
    </p>
    <p><a href="/">חזרה ל־OpenPOS</a></p>
  </main>

  <script>
    (() => {
      const form = document.getElementById("reset-form");
      const message = document.getElementById("message");
      const submit = document.getElementById("submit");

      function showMessage(text, type = "") {
        message.textContent = text;
        message.className = type;
      }

      async function initialize() {
        const hash = new URLSearchParams(location.hash.slice(1));
        const query = new URLSearchParams(location.search);
        const params = new URLSearchParams([...query, ...hash]);

        let accessToken = params.get("access_token");
        const tokenType = params.get("type");
        const tokenHash = params.get("token_hash");
        const authError =
          params.get("error_description") || params.get("error");

        if (authError) {
          showMessage(authError.replace(/\\+/g, " "), "error");
          return;
        }

        if ((!accessToken || tokenType !== "recovery") && !tokenHash) {
          showMessage(
            "קישור האיפוס חסר או שפג תוקפו. בקש קישור איפוס חדש.",
            "error"
          );
          return;
        }

        // Remove one-time credentials from the visible URL immediately.
        history.replaceState(null, document.title, location.pathname);

        let config;
        try {
          const response = await fetch("/api/auth-config", {
            cache: "no-store"
          });

          if (!response.ok) {
            throw new Error("לא ניתן לטעון את הגדרות האימות.");
          }

          config = await response.json();

          if (!config.configured ||
              !config.supabaseUrl ||
              !config.supabaseAnonKey) {
            throw new Error("שירות האימות אינו מוגדר בשרת.");
          }

          // Supabase email templates may deliver either an implicit-flow
          // access token or a PKCE-compatible token_hash.
          if (tokenHash) {
            const verifyResponse = await fetch(
              config.supabaseUrl.replace(/\\/$/, "") + "/auth/v1/verify",
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "apikey": config.supabaseAnonKey
                },
                body: JSON.stringify({
                  token_hash: tokenHash,
                  type: "recovery"
                })
              }
            );
            const verified = await verifyResponse.json().catch(() => ({}));
            if (!verifyResponse.ok || !verified.access_token) {
              throw new Error(
                verified.msg ||
                verified.message ||
                verified.error_description ||
                "קישור האיפוס אינו תקף או שפג תוקפו. בקש קישור חדש."
              );
            }
            accessToken = verified.access_token;
          } else if (tokenType !== "recovery") {
            throw new Error("סוג קישור האיפוס אינו תקין.");
          }
        } catch (error) {
          showMessage(error.message, "error");
          return;
        }

        form.hidden = false;
        showMessage("הקישור תקין. הזן סיסמה חדשה.");

        form.addEventListener("submit", async event => {
          event.preventDefault();

          const password =
            document.getElementById("password").value;
          const confirmation =
            document.getElementById("confirm-password").value;

          if (password.length < 8) {
            showMessage("הסיסמה חייבת להכיל לפחות 8 תווים.", "error");
            return;
          }

          if (password !== confirmation) {
            showMessage("הסיסמאות אינן תואמות.", "error");
            return;
          }

          submit.disabled = true;
          submit.textContent = "שומר...";

          try {
            const response = await fetch(
              config.supabaseUrl.replace(/\/$/, "") + "/auth/v1/user",
              {
                method: "PUT",
                headers: {
                  "Content-Type": "application/json",
                  "apikey": config.supabaseAnonKey,
                  "Authorization": "Bearer " + accessToken
                },
                body: JSON.stringify({ password })
              }
            );

            const result = await response.json().catch(() => ({}));

            if (!response.ok) {
              throw new Error(
                result.msg ||
                result.message ||
                result.error_description ||
                "עדכון הסיסמה נכשל. בקש קישור איפוס חדש."
              );
            }

            form.hidden = true;
            showMessage(
              "הסיסמה עודכנה בהצלחה. כעת אפשר להתחבר ל־OpenPOS עם הסיסמה החדשה.",
              "success"
            );
          } catch (error) {
            showMessage(error.message, "error");
            submit.disabled = false;
            submit.textContent = "שמירת סיסמה חדשה";
          }
        });
      }

      initialize();
    })();
  </script>
</body>
</html>
